name: CI
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: make verify-sql-improvement-goal
      - run: make verify-vulnerabilities
  long-running:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: make verify-long-running
        env:
          SQL_FUZZ_TIME: 5m
