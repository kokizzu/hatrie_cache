name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: make release-build
      - run: make verify-release-reproducibility
      - run: make release-sbom
      - run: make verify-vulnerabilities
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle dist/hatrie-cache.bundle dist/hatrie-cache
      - run: cosign sign-blob --yes --bundle dist/hatrie-cli.bundle dist/hatrie-cli
      - run: cosign sign-blob --yes --bundle dist/hatrie-sql-lsp.bundle dist/hatrie-sql-lsp
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
